name: Release

# 推一个 v* 标签即自动构建便携版并挂到 Release；
# 也可以在 Actions 页面手动触发（workflow_dispatch）只构建、不上传。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PyInstaller（仅构建期依赖，运行期零依赖）
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: 校验版本号与标签是否一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (python -c "import sys;sys.path.insert(0,'.');from transit import __version__;print(__version__)").Trim()
          $tag = $env:GITHUB_REF_NAME
          Write-Host "代码版本 = $ver，标签 = $tag"
          if ($tag -ne "v$ver") {
            Write-Error "标签 $tag 与 transit/__init__.py 的 __version__ ($ver) 不一致，请先改版本号再打标签"
            exit 1
          }

      # 含完整的构建期门禁：配置模板一致性、样例分支覆盖、
      # 冻结后数据目录、WebUI 冒烟测试（默认无令牌放行 + Host/Origin 拒绝 + 可选令牌）
      - name: 构建便携版
        shell: pwsh
        run: pwsh -NoProfile -File build.ps1

      - name: 构建产物清单
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length
          Get-Content release/SHA256SUMS.txt

      - name: 从 CHANGELOG 提取本版说明
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          $lines = Get-Content -Encoding UTF8 CHANGELOG.md
          $hit = $lines | Select-String -Pattern "^##\s*\[$([regex]::Escape($ver))\]" | Select-Object -First 1
          $text = ""
          if ($hit) {
            $body = @()
            # 从标题的下一行开始收集（标题与 Release 名称重复，去掉）；
            # 遇到下一个二级标题即本节结束
            for ($i = $hit.LineNumber; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s') { break }
              $body += $lines[$i]
            }
            $text = ($body -join "`n").Trim()
          }
          if (-not $text) {
            Write-Host "CHANGELOG.md 中没有 $ver 的小节，退回自动生成说明"
            "has_section=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "已提取 $ver 小节（$($text.Length) 字符）"
            $header = @"
          免安装便携版：解压到任意目录，双击 ``TransIt.exe`` 即可，无需安装 Python。

          | 文件 | 说明 |
          |------|------|
          | ``TransIt-$ver-win64.zip`` | Windows 10 / 11（64 位）便携版 |
          | ``SHA256SUMS.txt`` | 校验和 |

          > exe 未做代码签名，首次运行会触发 SmartScreen「Windows 已保护你的电脑」，
          > 点「更多信息 → 仍要运行」即可。

          ---

          "@
            $footer = @"

          ---

          **升级**：替换 ``TransIt.exe``、``TransIt-CLI.exe`` 与 ``_internal/``，
          保留同目录下的 ``config.json``（API 配置）、``output/``、``uploads/``。

          完整变更见 [CHANGELOG.md](https://github.com/$env:GITHUB_REPOSITORY/blob/main/CHANGELOG.md)。
          "@
            $note = (($header -split "`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`n")
            $note = $note + "`n" + $text + "`n" + (($footer -split "`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`n")
            Set-Content -LiteralPath "release-notes.md" -Value $note -Encoding UTF8
            "has_section=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag  = $env:GITHUB_REF_NAME
          $ver  = (python -c "import sys;sys.path.insert(0,'.');from transit import __version__;print(__version__)").Trim()
          $has = "${{ steps.notes.outputs.has_section }}" -eq "true"

          # 已有 Release（手工建的）就追加附件，没有就按标签创建
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建中…"
            if ($has) {
              gh release create $tag --repo $repo --verify-tag --title "TransIt $tag" --notes-file release-notes.md
            } else {
              gh release create $tag --repo $repo --verify-tag --title "TransIt $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { Write-Error "创建 Release 失败"; exit 1 }
          } elseif ($has) {
            # 已存在则把说明刷新为 CHANGELOG 内容（避免手工建的 Release 说明过薄）
            gh release edit $tag --repo $repo --notes-file release-notes.md
          }

          $zip = "release/TransIt-$ver-win64.zip"
          if (-not (Test-Path $zip)) { Write-Error "找不到构建产物 $zip"; exit 1 }

          gh release upload $tag --repo $repo --clobber `
            (Resolve-Path $zip).Path `
            (Resolve-Path release/SHA256SUMS.txt).Path
          if ($LASTEXITCODE -ne 0) { Write-Error "上传附件失败"; exit 1 }
          Write-Host "已上传 $zip 与 SHA256SUMS.txt 到 $tag"

      - name: 保留构建产物（便于手动触发时下载）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: TransIt-win64
          path: |
            release/TransIt-*-win64.zip
            release/SHA256SUMS.txt
          retention-days: 14
